<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Perfect Hotel</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #002b50;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 560px;
      background: #00c565;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #002b50;
      color: #fff;
      z-index: 50;
      padding: 24px;
      text-align: center;
    }
    #loading-title { font-size: 24px; font-weight: 800; margin-bottom: 16px; }
    #progress-track {
      width: min(80vw, 320px);
      height: 14px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      overflow: hidden;
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00c565, #38bdf8);
      transition: width 0.15s ease;
    }
    #loading-pct { margin-top: 10px; font-size: 14px; color: #cbd5e1; }
  </style>
  <script>
    // Offline PokiSDK & PokiUnityBridge Mock (Không quảng cáo + Nhận thưởng tức thì)
    window._pokiBridge = "PokiUnitySDK";
    window.initPokiBridge = function (name) {
      window._pokiBridge = name || "PokiUnitySDK";
      if (window.myGameInstance) {
        window.myGameInstance.SendMessage(window._pokiBridge, "ready");
      } else {
        setTimeout(function () { window.initPokiBridge(window._pokiBridge); }, 100);
      }
    };
    window.commercialBreak = function () {
      setTimeout(function () {
        if (window.myGameInstance) {
          window.myGameInstance.SendMessage(window._pokiBridge, "commercialBreakCompleted");
        }
      }, 50);
    };
    window.rewardedBreak = function () {
      setTimeout(function () {
        if (window.myGameInstance) {
          window.myGameInstance.SendMessage(window._pokiBridge, "rewardedBreakCompleted", "true");
        }
      }, 50);
    };
    window.shareableURL = function () {
      setTimeout(function () {
        if (window.myGameInstance) {
          window.myGameInstance.SendMessage(window._pokiBridge, "shareableURLResolved", "");
        }
      }, 50);
    };
    window.getUser = function () {
      if (window.myGameInstance) window.myGameInstance.SendMessage(window._pokiBridge, "getUserResolved", "{}");
    };
    window.getToken = function () {
      if (window.myGameInstance) window.myGameInstance.SendMessage(window._pokiBridge, "getTokenResolved", "");
    };
    window.login = function () {
      if (window.myGameInstance) window.myGameInstance.SendMessage(window._pokiBridge, "loginResolved");
    };

    window.PokiSDK = {
      init: function () { return Promise.resolve(); },
      setDebug: function () {},
      gameLoadingStart: function () {},
      gameLoadingFinished: function () {},
      gameplayStart: function () {},
      gameplayStop: function () {},
      commercialBreak: function () { return Promise.resolve(); },
      rewardedBreak: function () { return Promise.resolve(true); },
      displayAd: function () {},
      destroyAd: function () {},
      customEvent: function () {},
      measure: function () {},
      movePill: function () {},
      logError: function () {},
      openExternalLink: function () {},
      isAdBlocked: function () { return false; },
      getLanguage: function () { return "en"; },
      getURLParam: function () { return ""; }
    };
  </script>
</head>
<body>
  <div id="loading-overlay">
    <div id="loading-title">My Perfect Hotel</div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="loading-pct">Đang tải... 0%</div>
  </div>
  <div id="game-wrap">
    <canvas id="unity-canvas"></canvas>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/ea153e321edf23b9a40b38d65ce41d01.loader.js";
    var config = {
      dataUrl: buildUrl + "/101a0553a2917fd4c62a7e2159d30814.data",
      frameworkUrl: buildUrl + "/2809ee090e7f1bf0e1a32425590981e7.framework.js",
      codeUrl: buildUrl + "/9d94f3fbc22c5914756c67722e0cdaca.wasm",
      companyName: "master",
      productName: "My Hotel",
      productVersion: "1.0.3",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    var canvas = document.getElementById("unity-canvas");
    var loadingOverlay = document.getElementById("loading-overlay");
    var progressFill = document.getElementById("progress-fill");
    var progressPct = document.getElementById("loading-pct");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        progressFill.style.width = pct + "%";
        progressPct.textContent = "Đang tải... " + pct + "%";
      }).then(function (unityInstance) {
        window.myGameInstance = unityInstance;
        loadingOverlay.style.display = "none";
      }).catch(function (err) {
        progressPct.textContent = "Lỗi tải game: " + err;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
