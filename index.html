<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Perfect Hotel</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script>
      // Giữ hàm quảng cáo rỗng để game không bị lỗi thiếu biến khi chạy offline/GitHub Pages
      window.adsbygoogle = window.adsbygoogle || [];
      window.adConfig = window.adBreak = function () {};
      window.passBeforeAdData = function () {};
      window.adBreakDoneData = function () {
        if (window.myGameInstance) window.myGameInstance.SendMessage("GameObjectAds", "resumeGame");
      };
      window.gainReward = function () {
        if (window.myGameInstance) {
          window.myGameInstance.SendMessage("GameObjectAds", "resumeGameRewarded");
          window.myGameInstance.SendMessage("GameObjectAds", "rewardAdsCompleted");
        }
      };
      window.cancelReward = window.gainReward;
      window.noRewardAdsAvailable = window.gainReward;
      window.showNextAd = function () { setTimeout(window.adBreakDoneData, 50); };
      window.showReward = function () { setTimeout(window.gainReward, 50); };

      // Bắt AudioContext an toàn qua AudioNode.prototype.connect (không đụng vào constructor AudioContext)
      (function () {
        var contexts = new Set();
        var origConnect = AudioNode.prototype.connect;
        AudioNode.prototype.connect = function () {
          if (this.context) contexts.add(this.context);
          return origConnect.apply(this, arguments);
        };
        window.__toggleGameMute = function (mute) {
          contexts.forEach(function (ctx) {
            try {
              if (mute) ctx.suspend();
              else ctx.resume();
            } catch (e) {}
          });
        };
      })();
    </script>
    <style>
      #btn-sound-toggle {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 99999;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.45);
        background: rgba(15, 23, 42, 0.78);
        color: #fff;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <button id="btn-sound-toggle" title="Bật/Tắt âm thanh">🔊</button>
    <script>
      (function () {
        var isMuted = false;
        var btn = document.getElementById("btn-sound-toggle");
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          isMuted = !isMuted;
          btn.textContent = isMuted ? "🔇" : "🔊";
          if (window.__toggleGameMute) window.__toggleGameMute(isMuted);
        });
      })();
    </script>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=640></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Perfect Hotel</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/My_Perfect_Hotel_output_v17.loader.js";
      var config = {
        dataUrl: buildUrl + "/My_Perfect_Hotel_output_v17.data",
        frameworkUrl: buildUrl + "/My_Perfect_Hotel_output_v17.framework.js",
        codeUrl: buildUrl + "/My_Perfect_Hotel_output_v17.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "perfect",
        productName: "Perfect Hotel",
        productVersion: "1",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var mobileWarning = document.querySelector("#unity-mobile-warning");

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        canvas.style.width = "100vw";
        canvas.style.height = "100dvh";
        mobileWarning.style.display = "none";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "640px";
      }
      loadingBar.style.display = "block";
      var myGameInstance = null;
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          myGameInstance = unityInstance;
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
